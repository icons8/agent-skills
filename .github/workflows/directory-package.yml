name: Directory package

# The Anthropic plugin directory takes scripts and package-manager files only from Verified
# organizations. This workflow builds the lite package (no scripts, no package.json, no lockfiles)
# from the tracked tree and keeps it on the branch `claude-directory`, which the directory follows.
# The full plugin stays on `main` and installs from the repository marketplace.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: directory-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A closed pull request builds nothing; `cleanup` below removes its preview branch.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -v
      - run: python .github/scripts/build_directory_package.py "$RUNNER_TEMP/lite"
      - run: python .github/scripts/check_directory_package.py "$RUNNER_TEMP/lite"
      # Claude Code's own validator with the directory profile. It needs no sign-in. It checks a subset of the
      # portal's rules (not the Verified-organization gate, which `check_directory_package.py` covers), and
      # --strict also fails on warnings. The version is pinned; raise it on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@2.1.322
      - run: claude plugin validate --profile directory --strict "$RUNNER_TEMP/lite"
      - uses: actions/upload-artifact@v4
        with:
          name: directory-package
          path: ${{ runner.temp }}/lite
          include-hidden-files: true

  publish:
    # Only a push to main publishes. A pull request builds and checks, nothing more.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: directory-package
          path: lite
      - name: Commit the package to claude-directory when its content changed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q branch
          cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$repo_url"
          if git fetch -q --depth=1 origin claude-directory; then
            git checkout -q -b claude-directory FETCH_HEAD
          else
            git checkout -q --orphan claude-directory
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../lite/. .
          git add -A
          if git diff --cached --quiet; then
            echo "The package did not change; nothing to publish."
            exit 0
          fi
          git commit -q -m "Directory package from ${SOURCE_SHA}"
          git push origin claude-directory

  preview:
    # Every pull request from this repository gets its package on `claude-directory-preview/pr-<number>`,
    # so the result can be opened on GitHub or pasted into the portal's Validate form (Repository, Branch).
    # A pull request from a fork has a read-only token and gets only the artifact of the `build` job.
    # The prefix differs from `claude-directory`: Git cannot hold both `x` and `x/y` as branches.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: directory-package
          path: lite
      - name: Push the package to the preview branch of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch="claude-directory-preview/pr-${PR_NUMBER}"
          git init -q preview
          cd preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan "$branch"
          cp -R ../lite/. .
          git add -A
          git commit -q -m "Directory package preview of pull request ${PR_NUMBER} at ${SOURCE_SHA}"
          git push --force origin "$branch"
          {
            echo "### Directory package preview"
            echo
            echo "Branch: [\`${branch}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${branch})"
            echo
            echo "Paste \`${GITHUB_REPOSITORY}\` and \`${branch}\` into the portal's Validate form to see its verdict."
            echo
            echo "Files: $(git ls-files | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the preview branch of the closed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/claude-directory-preview/pr-${PR_NUMBER}" || echo "No preview branch to delete."
