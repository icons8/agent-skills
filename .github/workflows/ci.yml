name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A rapid string of pushes to the same branch/PR only needs the latest run: cancel a superseded
# one instead of letting them queue and burn runner time on commits nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Packaging and documentation checks against tracked files: the manifests and the skill documents
  # are the product, and this is the job that reads them. Linux only, because none of it depends on
  # the operating system — everything that does is in `portability` below, which is where a
  # per-platform verdict actually means something.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/validate_plugin.py
      - run: python -m unittest discover tests

  # A PR that bumps the plugin version has to date the top CHANGELOG entry with the UTC day of this
  # run: a date written days ago, or copied from the previous release, goes red. A PR that leaves
  # the four manifest versions alone passes without a look at the date. The day compared is that of
  # the last push to the PR, not of the merge. A tag is checked the same way by release-tag.yml.
  changelog-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python .github/scripts/check_changelog_date.py pr --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # What the checkout on each operating system actually produced: line endings, the .mcp.json
  # symlink, filename legality, the case of every cited reference path, and whether a shipped
  # script loads under that runner's interpreter. Windows is the job that would catch a CRLF
  # checkout or a citation whose case only resolves on a case-insensitive filesystem.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/verify_portability.py
